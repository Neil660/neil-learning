spring.application.name=spring-boot-quartz
server.port=9914

spring.boot.quartz.group-ids=1,

spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.url=${mysql.datasource.url}
spring.datasource.username=${mysql.datasource.username}
spring.datasource.password=${mysql.datasource.password}

#### Quartz集群配置
org.quartz.scheduler.instanceName=MyClusteredScheduler
# 每个Quartz实例必须具有唯一的实例ID，AUTO会自动生成一个唯一的实例ID
org.quartz.scheduler.instanceId=AUTO
org.quartz.scheduler.skipUpdateCheck=true
org.quartz.scheduler.jobFactory.class=org.quartz.simpl.SimpleJobFactory
org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
org.quartz.threadPool.threadCount=25
org.quartz.threadPool.threadPriority=5
org.quartz.jobStore.class=org.quartz.impl.jdbcjobstore.JobStoreTX
org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
org.quartz.jobStore.tablePrefix=QRTZ_
# 启动集群模式
org.quartz.jobStore.isClustered=true
org.quartz.jobStore.clusterCheckinInterval=20000
# 数据源配置
org.quartz.dataSource.myDS.driver=com.mysql.jdbc.Driver
org.quartz.dataSource.myDS.URL=${mysql.datasource.url}
org.quartz.dataSource.myDS.user=${mysql.datasource.username}
org.quartz.dataSource.myDS.password=${mysql.datasource.password}
org.quartz.dataSource.myDS.maxConnections=5
